version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v3 does not add the tool to PATH on Windows: https://github.com/Alex079/setup-custom-tool/issues/16
      - dependency-name: "Alex079/setup-custom-tool"
        update-types: ["version-update:semver-major"]
